{% extends 'base.html' %}

{% block title %}Board Not Found | TaskPulse{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full glass-panel p-8 rounded-3xl border border-slate-800 space-y-4">
        <div class="w-16 h-16 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center mx-auto text-3xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="text-xl font-heading font-bold text-white">404 - Workspace Not Found</h2>
        <p class="text-xs text-slate-400 leading-relaxed">
            The board link you opened might be invalid or deleted. Check your URL or return to your dashboard.
        </p>
        <a href="/" class="inline-block px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition">
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
